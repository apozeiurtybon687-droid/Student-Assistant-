name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Keystore and Environment Files
        run: |
          # Restore debug keystore if base64 file is present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi
          # Ensure .env file exists so Secrets Gradle plugin succeeds
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          # Grant execution permission for Gradle Wrapper
          chmod +x gradlew

      - name: Build Debug APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLectureNotes-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
