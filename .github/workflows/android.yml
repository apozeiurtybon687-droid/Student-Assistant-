name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK Licenses and Environment
        run: |
          echo "Configuring Android SDK and accepting licenses..."
          mkdir -p "$ANDROID_HOME/licenses"
          
          # Standard Android SDK and Preview License hashes
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55" >> "$ANDROID_HOME/licenses/android-sdk-license"
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd\n504667f4c0de7af1a06de9f4b1727b84351f2910" >> "$ANDROID_HOME/licenses/android-sdk-preview-license"
          
          # Restore debug keystore from base64 if present
          if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Restored debug.keystore successfully"
          fi

          # Ensure .env file exists for Secrets Gradle plugin
          if [ ! -f .env ]; then
            cp .env.example .env
            echo "Generated default .env file"
          fi

          # Grant execution permissions to gradlew
          chmod +x gradlew

      - name: Build APK with Gradle
        run: ./gradlew assembleDebug --no-daemon --stacktrace -Dorg.gradle.configuration-cache=false

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartLectureNotes-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
